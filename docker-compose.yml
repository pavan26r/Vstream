version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vp_postgres
    environment:
      POSTGRES_DB: videodb
      POSTGRES_USER: vpuser
      POSTGRES_PASSWORD: vppassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpuser -d videodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  node_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vp_node
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://vpuser:vppassword@postgres:5432/videodb
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django_app:
    build:
      context: ./django_processor
      dockerfile: Dockerfile
      network: host
    container_name: vp_django
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://vpuser:vppassword@postgres:5432/videodb
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./django_processor:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: gunicorn video_processor.wsgi:application --bind 0.0.0.0:8000

  celery_worker:
    build:
      context: ./django_processor
      dockerfile: Dockerfile
      network: host
    container_name: vp_celery_worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://vpuser:vppassword@postgres:5432/videodb
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./django_processor:/app
    depends_on:
      - redis
      - django_app
    command: celery -A video_processor worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: ./django_processor
      dockerfile: Dockerfile
      network: host
    container_name: vp_celery_beat
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://vpuser:vppassword@postgres:5432/videodb
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./django_processor:/app
    depends_on:
      - redis
    command: celery -A video_processor beat --loglevel=info

  flower:
    build:
      context: ./django_processor
      dockerfile: Dockerfile
      network: host
    container_name: vp_flower
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    command: celery -A video_processor flower --port=5555

volumes:
  postgres_data:
